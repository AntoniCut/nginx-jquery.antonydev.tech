<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;
            /* */

    </style>
    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Botón dividido</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/26-controlgroup-split.css">

<body>
    <main>
        <a class="volver" href="../">Controlgroup</a>
        <h1>Botón dividido</h1>

        <div class="escenario">
            <div id="dividido">
                <button type="button" id="ejecutar">Ejecutar</button>
                <select id="accion">
                    <option>Ejecutar</option>
                    <option>Guardar</option>
                    <option>Cancelar</option>
                </select>
            </div>
            <p id="resultado" class="nota">Todavía no hay una acción.</p>
        </div>

        <div class="demo-description">
            <p>El botón ejecuta la acción visible. El menú de al lado cambia esa acción.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
    <script src="../../assets/js/26-controlgroup-split.js"></script>
</body>
