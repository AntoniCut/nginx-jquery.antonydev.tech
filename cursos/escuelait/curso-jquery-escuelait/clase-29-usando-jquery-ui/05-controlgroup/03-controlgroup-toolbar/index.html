<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;
            /* */
        }
    </style>
    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Barra de herramientas</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/27-controlgroup-toolbar.css">
    <script src="/cursos/escuelait/curso-jquery-escuelait/clase-29-usando-jquery-ui/assets/js/url.js"></script>
</head>

<body>
    <main>
        <a class="volver" href="../">Controlgroup</a>
        <h1>Barra de herramientas</h1>

        <div class="escenario">
            <div id="barra">
                <label for="negrita">Negrita</label>
                <input type="checkbox" id="negrita">
                <label for="cursiva">Cursiva</label>
                <input type="checkbox" id="cursiva">
                <label for="subrayado">Subrayado</label>
                <input type="checkbox" id="subrayado">
                <label for="izquierda">Izquierda</label>
                <input type="radio" name="alineacion" id="izquierda" checked>
                <label for="centro">Centro</label>
                <input type="radio" name="alineacion" id="centro">
                <label for="derecha">Derecha</label>
                <input type="radio" name="alineacion" id="derecha">
                <select id="tamano">
                    <option>12 px</option>
                    <option selected>16 px</option>
                    <option>20 px</option>
                    <option>24 px</option>
                </select>
            </div>
            <p id="muestra">Texto de muestra.</p>
        </div>

        <div class="demo-description">
            <p>Casillas, radios y un menú comparten una sola barra.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
    <script src="../../assets/js/27-controlgroup-toolbar.js"></script>
</body>

</html>
