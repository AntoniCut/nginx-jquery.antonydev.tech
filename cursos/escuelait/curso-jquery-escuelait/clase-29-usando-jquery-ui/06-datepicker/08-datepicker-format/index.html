<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;
            /* */
        }
    </style>
    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Formato de fecha</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/35-datepicker-format.css">
    <script src="/cursos/escuelait/curso-jquery-escuelait/clase-29-usando-jquery-ui/assets/js/url.js"></script>
</head>

<body>
    <main>
        <a class="volver" href="../">Datepicker</a>
        <h1>Formato de fecha</h1>

        <div class="escenario">
            <p class="campo">
                <label for="corto">Formato corto</label>
                <input id="corto" type="text" autocomplete="off">
            </p>
            <p class="campo">
                <label for="largo">Formato largo</label>
                <input id="largo" type="text" autocomplete="off">
            </p>
        </div>

        <div class="demo-description">
            <p>El mismo día puede mostrarse como <code>dd/mm/aa</code> o como fecha larga. El texto entre comillas simples se copia tal cual.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
    <script src="../../assets/js/35-datepicker-format.js"></script>
</body>

</html>
