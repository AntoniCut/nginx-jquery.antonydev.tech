<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;

    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Elegir un rango</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">

    <link rel="stylesheet" href="../../assets/css/06-datepicker/13-datepicker-range.css">

<body>
    <main>
        <a class="volver" href="../">Datepicker</a>
        <h1>Elegir un rango</h1>

        <div class="escenario">
            <p class="campo">
                <label for="desde">Desde</label>
                <input id="desde" type="text" autocomplete="off">
            </p>
            <p class="campo">
                <label for="hasta">Hasta</label>
                <input id="hasta" type="text" autocomplete="off">
            </p>
        </div>

        <div class="demo-description">
            <p>La fecha de inicio impide elegir un final anterior. La fecha final impide elegir un inicio posterior.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
