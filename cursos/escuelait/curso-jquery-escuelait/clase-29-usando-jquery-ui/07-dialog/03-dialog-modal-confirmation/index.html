<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;

    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Confirmación modal</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/07-dialog/03-dialog-modal-confirmation.css">

<body>
    <main>
        <a class="volver" href="../">Dialog</a>
        <h1>Confirmación modal</h1>

        <div class="escenario">
            <button type="button" id="borrar">Eliminar elemento</button>
            <p id="resultado" class="nota">El elemento sigue en la lista.</p>
            <div id="dialog" title="Confirmar">
                <p>¿Eliminar este elemento? Esta acción no se puede deshacer.</p>
            </div>
        </div>

        <div class="demo-description">
            <p>La ventana bloquea el resto de la página hasta que se elimina el elemento o se cancela.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
