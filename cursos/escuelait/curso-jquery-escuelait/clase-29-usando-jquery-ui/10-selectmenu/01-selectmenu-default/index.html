<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;
            /* */
        }
    </style>
    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Funcionalidad por defecto</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/10-selectmenu/01-selectmenu-default.css">
    <script src="/cursos/escuelait/curso-jquery-escuelait/clase-29-usando-jquery-ui/assets/js/url.js"></script>
</head>

<body>
    <main>
        <a class="volver" href="../">Selectmenu</a>
        <h1>Funcionalidad por defecto</h1>

        <div class="escenario">
            <p class="campo">
                <label for="velocidad">Velocidad</label>
                <select id="velocidad">
                    <option>Muy lenta</option>
                    <option>Lenta</option>
                    <option selected>Media</option>
                    <option>Rápida</option>
                    <option>Muy rápida</option>
                </select>
            </p>
            <p class="campo">
                <label for="archivo">Archivo</label>
                <select id="archivo">
                    <optgroup label="Scripts">
                        <option>jquery.js</option>
                        <option>jquery-ui.js</option>
                    </optgroup>
                    <optgroup label="Otros">
                        <option>notas.txt</option>
                        <option>un archivo con un nombre bastante largo</option>
                    </optgroup>
                </select>
            </p>
            <p class="campo">
                <label for="numero">Número</label>
                <select id="numero">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
                </select>
            </p>
            <p class="campo">
                <label for="trato">Trato</label>
                <select id="trato">
                    <option value="">Elige uno</option>
                    <option>Sr.</option>
                    <option>Sra.</option>
                    <option>Dr.</option>
                    <option>Dra.</option>
                </select>
            </p>
        </div>

        <div class="demo-description">
            <p>Hay un select simple, otro con grupos, una lista larga con desplazamiento y uno con un valor vacío.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
    <script src="../../assets/js/10-selectmenu/01-selectmenu-default.js"></script>
</body>

</html>
