<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;
            /* */
        }
    </style>
    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Presentación propia</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/10-selectmenu/02-selectmenu-rendering.css">
    <script src="/cursos/escuelait/curso-jquery-escuelait/clase-29-usando-jquery-ui/assets/js/url.js"></script>
</head>

<body>
    <main>
        <a class="volver" href="../">Selectmenu</a>
        <h1>Presentación propia</h1>

        <div class="escenario">
            <p class="campo">
                <label for="archivo">Archivo</label>
                <select id="archivo">
                    <option data-icono="ui-icon-script">jquery.js</option>
                    <option data-icono="ui-icon-image">foto.png</option>
                    <option data-icono="ui-icon-video">clip.mp4</option>
                    <option data-icono="ui-icon-note" disabled>borrador.txt</option>
                </select>
            </p>
        </div>

        <div class="demo-description">
            <p>Cada opción pinta el icono indicado en <code>data-icono</code> junto al texto.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
    <script src="../../assets/js/10-selectmenu/02-selectmenu-rendering.js"></script>
</body>

</html>
