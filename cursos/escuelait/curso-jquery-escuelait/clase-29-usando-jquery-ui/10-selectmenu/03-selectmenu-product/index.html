<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;
            /* */
        }
    </style>
    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Selección de producto</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/10-selectmenu/03-selectmenu-product.css">
    <script src="/cursos/escuelait/curso-jquery-escuelait/clase-29-usando-jquery-ui/assets/js/url.js"></script>
</head>

<body>
    <main>
        <a class="volver" href="../">Selectmenu</a>
        <h1>Selección de producto</h1>

        <div class="escenario">
            <div id="circulo"></div>
            <fieldset class="controles">
                <label for="radio">Radio del círculo</label>
                <select id="radio">
                    <option value="50px">50px</option>
                    <option value="100px">100px</option>
                    <option value="150px" selected>150px</option>
                    <option value="200px">200px</option>
                    <option value="250px">250px</option>
                </select>

                <label for="color">Color del círculo</label>
                <select id="color">
                    <option value="black">Negro</option>
                    <option value="red">Rojo</option>
                    <option value="yellow" selected>Amarillo</option>
                    <option value="blue">Azul</option>
                    <option value="green">Verde</option>
                </select>
            </fieldset>
        </div>

        <div class="demo-description">
            <p>Los menús cambian el radio y el color del círculo.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
    <script src="../../assets/js/10-selectmenu/03-selectmenu-product.js"></script>
</body>

</html>
