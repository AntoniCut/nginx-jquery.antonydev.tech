<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;
            /* */
        }
    </style>
    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Funcionalidad por defecto</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/12-spinner/01-spinner-default.css">
    <script src="/cursos/escuelait/curso-jquery-escuelait/clase-29-usando-jquery-ui/assets/js/url.js"></script>
</head>

<body>
    <main>
        <a class="volver" href="../">Spinner</a>
        <h1>Funcionalidad por defecto</h1>

        <div class="escenario">
            <p class="campo">
                <label for="spinner">Valor</label>
                <input id="spinner" name="valor" value="0">
            </p>
            <div class="acciones">
                <button type="button" id="alternar">Activar o desactivar</button>
                <button type="button" id="widget">Quitar o crear</button>
                <button type="button" id="leer">Leer valor</button>
                <button type="button" id="fijar">Fijar en 5</button>
            </div>
            <p id="resultado" class="nota">Pulsa Leer valor.</p>
        </div>

        <div class="demo-description">
            <p>Los botones desactivan el control, lo quitan y lo vuelven a crear, leen el valor y lo fijan en 5. El valor se escribe en la página.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
    <script src="../../assets/js/12-spinner/01-spinner-default.js"></script>
</body>

</html>
