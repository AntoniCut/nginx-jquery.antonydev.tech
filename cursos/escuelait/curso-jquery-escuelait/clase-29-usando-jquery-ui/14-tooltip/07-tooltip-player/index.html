<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @view-transition {
            navigation: auto;
            /* */
        }
    </style>
    <link rel="shortcut icon" href="/assets/favicon/jquery-favicon.svg" type="image/svg+xml">
    <title>Reproductor</title>
    <link rel="stylesheet" href="/assets/libs/jquery-ui/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/14-tooltip/07-tooltip-player.css">
    <script src="/cursos/escuelait/curso-jquery-escuelait/clase-29-usando-jquery-ui/assets/js/url.js"></script>
</head>

<body>
    <main>
        <a class="volver" href="../">Tooltip</a>
        <h1>Reproductor</h1>

        <div class="escenario">
            <div class="pantalla">Aquí va el vídeo (¿HTML5?)</div>
            <div class="herramientas">
                <span class="grupo">
                    <button type="button" data-icon="ui-icon-circle-arrow-n" title="Esto me gusta">Me gusta</button>
                    <button type="button" data-icon="ui-icon-circle-arrow-s">Esto no me gusta</button>
                </span>
                <div class="grupo">
                    <button type="button" data-icon="ui-icon-circle-plus" title="Añadir para ver más tarde">Añadir</button>
                    <button type="button" class="menu" data-icon="ui-icon-triangle-1-s">Añadir a favoritos o a una lista</button>
                    <ul id="listas">
                        <li>
                            <div>Favoritos</div>
                        </li>
                        <li>
                            <div>Graciosos</div>
                        </li>
                        <li></li>
                        <li>
                            <div>Nueva lista…</div>
                        </li>
                    </ul>
                </div>
                <button type="button" title="Compartir este vídeo">Compartir</button>
                <button type="button" data-icon="ui-icon-alert">Marcar como inapropiado</button>
            </div>
        </div>

        <div class="demo-description">
            <p>Un reproductor falso, con botones de me gusta, compartir y aviso. La ayuda de cada botón usa un estilo propio.</p>
        </div>
    </main>

    <script src="/assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/jquery-ui/jquery-ui-1.14.2.min.js"></script>
    <script src="../../assets/js/14-tooltip/07-tooltip-player.js"></script>
</body>

</html>
